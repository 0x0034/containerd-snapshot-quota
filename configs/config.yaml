version: v1
persistDir: /var/lib/quota-agent
logLevel: info

manager:
  runtime: containerd
  socket: /run/containerd/containerd.sock
  mountPoint: /var/lib/containerd
  size: "10G"
  projidMin: 1000
  projidMax: 65534
  autoQuota: true
  namespaces:
    - default
    - moby
    - k8s.io

  matchRules:
    - name: large-containers
      size: "50G"
      level: image
      selector:
        name: nginx
        tag: latest

    - name: critical-pods
      size: "100G"
      level: pod
      selector:
        name: api-server
        namespace: production

web:
  enabled: true
  host: 0.0.0.0
  port: 8080
